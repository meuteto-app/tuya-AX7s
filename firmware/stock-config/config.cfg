[system]
version=ipphone-v1.0
device_name=ipphone
language=1024
lock2_delay=3
rotate=0

[door]
door_lock_delay=2
talk_volume=6
ring_mode=0
ring_type=1
ring_time=30
ring_vol=9
backlight_en=0
motion=0
motion_sensitivity=1

[network]
#mode 0:EZ 1:AP
pairing_mode=1
wifi_ap_ssid=SmartLife-123456
#1:door 2:camera 3:indoor
device_type=1
device_id=0
alias=door1
device=eth0
net_type=auto
ip_addr=
netmask=
broadcast=
multicast=
gateway=

[doorEvent]
door_event=/dev/input/event2

